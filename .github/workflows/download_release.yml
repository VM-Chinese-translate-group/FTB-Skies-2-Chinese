name: Paratranz To GitHub

on:
  schedule:
    # 每天北京时间早晚10点左右自动运行
    - cron: "0 1,13 * * *"
  workflow_dispatch:

jobs:
  paratranz-to-gitHub:
    name: Paratranz To GitHub
    environment: PARATRANZ_ENV
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      API_TOKEN: ${{ secrets.API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_ID: ${{ vars.ID }}
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3"
          cache: pip
          cache-dependency-path: .github/requirements-ftb.txt

      - name: Install dependencies
        run: python -m pip install -r .github/requirements-ftb.txt

      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "VM[BOT]"

      - name: Sync translations from Paratranz
        run: python .github/scripts/para2github.py
        
      - name: Commit and Push changes
        id: commit
        run: |
          # 只提交下载到 CNPack 的译文；检查报告保留为构建产物，不进入仓库。
          git add -A -- CNPack
          if git diff --cached --quiet; then
            echo "No changes detected from Paratranz. Nothing to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m '从Paratranz同步翻译'
          git push

          echo "changed=true" >> $GITHUB_OUTPUT

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: paratranz-to-gitHub
    if: needs.paratranz-to-gitHub.outputs.changed == 'true'
    environment: PARATRANZ_ENV
    permissions: 
      contents: write

    steps:
      - name: Checkout code for Release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Parse Target Version from modpack.json
        id: parse_version
        run: |
          MC_VERSION=$(jq -r '.mcVersion // empty' .github/configs/modpack.json)
          LOADER=$(jq -r '.loader // empty' .github/configs/modpack.json)
          echo "mc_version=$MC_VERSION" >> $GITHUB_ENV
          echo "loader=$LOADER" >> $GITHUB_ENV

      - name: Find latest VMTU matching version
        id: vmtu
        if: ${{ env.mc_version != '' && env.loader != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(gh release view --repo vm-chinese-translate-group/VMTranslationUpdateMod --json tagName,assets)
          ASSETS=$(printf '%s' "$RELEASE" | jq -r '.assets[].name')
          ESCAPED_VERSION=$(printf '%s' "$mc_version" | sed 's/[][\\.^$*+?{}|()]/\\&/g')
          EXACT_FILE=$(printf '%s\n' "$ASSETS" | grep -Fi -- "$loader" | grep -E -- "${ESCAPED_VERSION}([^0-9]|$)" | head -n 1 || true)
          if [ -z "$EXACT_FILE" ]; then
            echo "Warning: No matching VMTU jar found for $mc_version and $loader"
            exit 0
          fi
          TAG=$(printf '%s' "$RELEASE" | jq -r '.tagName')
          ASSET_HASH=$(printf '%s' "$RELEASE" | jq -c --arg name "$EXACT_FILE" '{tagName, asset: (.assets[] | select(.name == $name) | {id, name, updatedAt, size})}' | sha256sum | cut -d ' ' -f 1)
          echo "file=$EXACT_FILE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "cache_key=vmtu-v1-$ASSET_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache VMTU download
        id: vmtu_cache
        if: steps.vmtu.outputs.file != ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vmtu-download
          key: ${{ steps.vmtu.outputs.cache_key }}

      - name: Download VMTU on cache miss
        if: steps.vmtu.outputs.file != '' && steps.vmtu_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VMTU_FILE: ${{ steps.vmtu.outputs.file }}
          VMTU_TAG: ${{ steps.vmtu.outputs.tag }}
        run: |
          gh release download "$VMTU_TAG" \
            --repo vm-chinese-translate-group/VMTranslationUpdateMod \
            --pattern "$VMTU_FILE" \
            --dir "$RUNNER_TEMP/vmtu-download" \
            --clobber

      - name: Copy VMTU into patch
        if: steps.vmtu.outputs.file != ''
        env:
          VMTU_FILE: ${{ steps.vmtu.outputs.file }}
        run: |
          mkdir -p ./CNPack/mods
          cp -- "$RUNNER_TEMP/vmtu-download/$VMTU_FILE" ./CNPack/mods/

      - name: Get current datetime for tag
        id: datetime
        run: echo "datetime=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Zip CNPack folder
        run: zip -r "VM-CNPack-${{ env.datetime }}.zip" ./CNPack

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "test-${{ env.datetime }}"
          name: "测试版构建 ${{ env.datetime }}"
          body: |
            自动生成的最新汉化补丁
          artifacts: |
            VM-CNPack-${{ env.datetime }}.zip
          draft: false
          prerelease: true
